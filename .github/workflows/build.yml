name: Build NeoForge modules

on:
  push:
    branches: ["arena/61f73e92-mods"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Gradle caching
        uses: gradle/actions/setup-gradle@v4
      - name: Validate original UI resource pack
        run: python3 create-fantasy-ui/tools/validate_pack.py
      - name: Verify Gradle wrapper
        run: timeout 8m ./gradlew --no-daemon --console=plain --version
      - name: Configure NeoForge projects
        run: timeout 12m ./gradlew --no-daemon --console=plain --stacktrace --info help
      - name: Compile all five independent mod projects
        shell: bash
        run: |
          set -o pipefail
          timeout 45m ./gradlew --no-daemon --console=plain --stacktrace --info --max-workers=2 clean build 2>&1 | tee gradle-build.log
      - name: Publish Gradle log artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 3
      - name: Add build diagnostics to the run summary and check annotations
        if: failure()
        shell: bash
        run: |
          echo '### Gradle diagnostics (last 120 lines)' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f gradle-build.log ]]; then
            echo '#### Compiler and failure markers' >> "$GITHUB_STEP_SUMMARY"
            grep -E -i '(^e: |error:|cannot find symbol|symbol:|location:|what went wrong|execution failed|could not resolve|failed to)' gradle-build.log | tail -n 30 >> "$GITHUB_STEP_SUMMARY" || true
            tail -n 120 gradle-build.log >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              escaped=${line//'%'/'%25'}
              escaped=${escaped//$'\r'/'%0D'}
              escaped=${escaped//$'\n'/'%0A'}
              echo "::error title=Gradle diagnostic::$escaped"
            done < <(tail -n 40 gradle-build.log)
          else
            echo 'No Gradle output file was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
