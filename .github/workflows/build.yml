name: Build NeoForge modules

on:
  push:
    branches: ["arena/61f73e92-mods"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Gradle caching
        uses: gradle/actions/setup-gradle@v4
      - name: Verify Gradle wrapper
        run: timeout 8m ./gradlew --no-daemon --console=plain --version
      - name: Configure NeoForge projects
        run: timeout 12m ./gradlew --no-daemon --console=plain --stacktrace --info help
      - name: Compile all five independent mod projects
        shell: bash
        run: |
          set -o pipefail
          timeout 30m ./gradlew --no-daemon --console=plain --stacktrace --info clean build 2>&1 | tee gradle-build.log
      - name: Publish Gradle log artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 3
      - name: Add build diagnostics to the run summary
        if: failure()
        shell: bash
        run: |
          echo '### Gradle diagnostics (last 120 lines)' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f gradle-build.log ]]; then tail -n 120 gradle-build.log >> "$GITHUB_STEP_SUMMARY"; else echo 'No Gradle output file was produced.' >> "$GITHUB_STEP_SUMMARY"; fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
