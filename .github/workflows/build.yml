name: Build NeoForge modules

on:
  push:
    branches: ["arena/61f73e92-mods"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build all five independent mod projects
        run: ./gradlew --no-daemon clean build
